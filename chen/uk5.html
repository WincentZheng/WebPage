            e('ul', { className: 'space-y-2.5 text-xs text-slate-700 list-disc pl-4 leading-relaxed' },
              e('li', null, e('strong', { className: 'text-british-red' }, 'D1 入住必看：'), '民宿通常沒有 24 小時前台，請提前透過 Airbnb 確認抵達時間與入住方式。'),
              e('li', null, e('strong', { className: 'text-british-red' }, 'D12 行李寄存：'), '若退房後無法寄放行李，可至 Paddington 車站的 Left Luggage 付費寄存中心辦理。')
            )
          )
        );
      };

      const ExpenseTab = () => {
        const [desc, setDesc] = useState('');
        const [amount, setAmount] = useState('');
        const [category, setCategory] = useState('飲食');
        const categories = ['飲食', '交通', '購物', '門票', '住宿', '其他'];

        const handleAdd = (event) => {
          event.preventDefault();
          if (!desc || !amount) return;
          const gbp = parseFloat(amount);
          const newExp = { id: Date.now(), date: new Date().toLocaleDateString('zh-TW'), desc, category, gbp, twd: Math.round(gbp * exchangeRate) };
          setExpenses([newExp, ...expenses]);
          setDesc(''); setAmount('');
        };

        const del = (id) => setExpenses(expenses.filter(item => item.id !== id));

        return e('div', { className: 'space-y-4' },
          e('div', { className: 'flex justify-between items-end px-1 border-l-4 border-royal-navy pl-2' },
            e('h2', { className: 'text-xl font-bold text-slate-800' }, '公費記帳簿'),
            e('span', { className: 'text-xs font-bold text-london-gold bg-royal-navy px-2 py-0.5 rounded' }, '固定匯率 £1 = ' + exchangeRate + ' TWD')
          ),
          e('form', { onSubmit: handleAdd, className: 'bg-white rounded-xl shadow-sm border p-4 space-y-4' },
            e('div', { className: 'grid grid-cols-2 gap-3' },
              e('div', null,
                e('label', { className: 'block text-xs font-bold text-slate-400 mb-1' }, '項目名稱'),
                e('input', { type: 'text', value: desc, onChange: (event) => setDesc(event.target.value), placeholder: '例: Flat Iron 牛排', className: 'w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-royal-navy', required: true })
              ),
              e('div', null,
                e('label', { className: 'block text-xs font-bold text-slate-400 mb-1' }, '項目分類'),
                e('select', { value: category, onChange: (event) => setCategory(event.target.value), className: 'w-full border border-slate-200 rounded-xl p-2.5 text-sm outline-none focus:border-royal-navy bg-white' },
                  categories.map(c => e('option', { key: c, value: c }, c))
                )
              )
            ),
            e('div', null,
              e('label', { className: 'block text-xs font-bold text-slate-400 mb-1' }, '金額 (英鎊 GBP)'),
              e('div', { className: 'relative' },
                e('span', { className: 'absolute left-3.5 top-2.5 text-slate-400 font-bold' }, '£'),
                e('input', { type: 'number', step: '0.01', value: amount, onChange: (event) => setAmount(event.target.value), placeholder: '0.00', className: 'w-full border border-slate-200 rounded-xl p-2.5 pl-8 text-sm outline-none focus:border-royal-navy', required: true })
              ),
              amount && e('div', { className: 'text-xs text-slate-400 mt-1.5 text-right font-medium' }, '換算台幣約 NT$ ' + Math.round(amount * exchangeRate).toLocaleString())
            ),
            e('button', { type: 'submit', className: 'w-full bg-royal-navy text-white font-bold rounded-xl py-3 text-sm tracking-wider active:opacity-90 transition-opacity' }, '新增一筆花費')
          ),
          e('div', { className: 'space-y-2 mt-4' },
            e('h3', { className: 'text-xs font-bold text-slate-400 uppercase tracking-wider px-1' }, '消費明細'),
            expenses.length === 0 ? e('div', { className: 'text-center text-slate-300 text-sm py-8 bg-white rounded-xl border border-dashed' }, '目前還沒有記帳紀錄喔！') : expenses.map(exp => (
              e('div', { key: exp.id, className: 'bg-white rounded-xl p-3.5 shadow-sm border border-slate-100 flex justify-between items-center' },
                e('div', null,
                  e('div', { className: 'flex items-center gap-2' },
                    e('span', { className: 'text-[10px] font-black bg-slate-100 text-slate-600 px-2 py-0.5 rounded' }, exp.category),
                    e('span', { className: 'font-semibold text-slate-800 text-sm' }, exp.desc)
                  ),
                  e('div', { className: 'text-[10px] text-slate-400 mt-1 font-medium' }, exp.date)
                ),
                e('div', { className: 'text-right flex items-center gap-3.5' },
                  e('div', null,
                    e('div', { className: 'font-extrabold text-royal-navy text-sm' }, '£' + exp.gbp.toFixed(2)),
                    e('div', { className: 'text-[10px] text-slate-400 font-medium' }, 'NT$' + exp.twd.toLocaleString())
                  ),
                  e('button', { onClick: () => del(exp.id), className: 'text-slate-300 hover:text-red-500 font-bold text-base p-1' }, '✕')
                )
              )
            ))
          )
        );
      };

      const SummaryTab = () => {
        const totalGBP = expenses.reduce((sum, item) => sum + item.gbp, 0);
        const totalTWD = expenses.reduce((sum, item) => sum + item.twd, 0);
        const catTotals = expenses.reduce((acc, item) => { acc[item.category] = (acc[item.category] || 0) + item.gbp; return acc; }, {});

        return e('div', { className: 'space-y-4' },
          e('h2', { className: 'text-xl font-bold text-slate-800 px-1 border-l-4 border-royal-navy pl-2' }, '預算花費總覽'),
          e('div', { className: 'bg-gradient-to-br from-slate-900 to-slate-800 rounded-2xl shadow-md p-6 text-white text-center relative overflow-hidden border border-slate-700' },
            e('div', { className: 'text-xs text-london-gold font-bold uppercase tracking-widest opacity-80 mb-1' }, 'Total Expenses'),
            e('div', { className: 'text-4xl font-black mb-2 tracking-tight text-white' }, '£ ' + totalGBP.toFixed(2)),
            e('div', { className: 'text-xs opacity-90 border-t border-slate-700 pt-2.5 inline-block px-6 font-medium text-slate-300' }, '等值台幣約 NT$ ' + totalTWD.toLocaleString())
          ),
          e('div', { className: 'bg-white rounded-xl shadow-sm border p-4' },
            e('h3', { className: 'text-xs font-bold text-slate-400 uppercase tracking-wider mb-4 border-b pb-2' }, '各類支出佔比'),
            Object.keys(catTotals).length === 0 ? e('div', { className: 'text-center text-slate-300 text-sm py-4' }, '暫無統計資料') : (
              e('div', { className: 'space-y-4' },
                Object.entries(catTotals).sort((a, b) => b[1] - a[1]).map(([cat, amount]) => {
                  const pct = totalGBP > 0 ? ((amount / totalGBP) * 100).toFixed(1) : 0;
                  return e('div', { key: cat },
                    e('div', { className: 'flex justify-between text-xs mb-1.5' },
                      e('span', { className: 'font-bold text-slate-700' }, cat),
                      e('span', { className: 'font-extrabold text-royal-navy' }, '£' + amount.toFixed(2) + ' ', e('span', { className: 'text-[10px] text-slate-400 font-normal' }, '(' + pct + '%)'))
                    ),
                    e('div', { className: 'w-full bg-slate-100 rounded-full h-2' },
                      e('div', { className: 'bg-london-gold h-2 rounded-full', style: { width: pct + '%' } })
                    )
                  );
                })
              )
            )
          )
        );
      };

      const TabButton = (tab, iconComponent, label) => {
        const isSel = activeTab === tab;
        return e('button', {
          onClick: () => setActiveTab(tab),
          className: 'flex flex-col items-center justify-center w-full h-full transition-all active:scale-95 ' + (isSel ? 'text-royal-navy scale-105' : 'text-slate-400')
        }, 
          e('div', { className: isSel ? 'bg-slate-100 p-1.5 rounded-xl text-royal-navy' : 'p-1.5' }, e(iconComponent)), 
          e('span', { className: 'text-[10px] mt-0.5 font-bold tracking-wider' }, label)
        );
      };

      return e('div', { className: 'max-w-md mx-auto min-h-screen relative pb-nav bg-slate-50 shadow-xl' },
        e('div', { className: 'bg-royal-navy border-b border-slate-800 sticky top-0 z-10 px-4 py-3.5 shadow-md flex justify-center items-center gap-2' },
          e('span', { className: 'text-lg' }, '🇬🇧'),
          e('h1', { className: 'font-black text-sm tracking-widest text-white uppercase' }, 'London Bound 12 Days')
        ),
        e('div', { className: 'p-4' },
          activeTab === 'itinerary' && e(ItineraryTab),
          activeTab === 'accommodation' && e(AccommodationTab),
          activeTab === 'expense' && e(ExpenseTab),
          activeTab === 'summary' && e(SummaryTab)
        ),
        e('div', { className: 'fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-around items-center h-20 z-20 shadow-[0_-4px_20px_rgba(0,0,0,0.04)] max-w-md mx-auto px-2' },
          TabButton('itinerary', Icons.Map, '行程'),
          TabButton('accommodation', Icons.Home, '住宿'),
          TabButton('expense', Icons.Wallet, '記帳'),
          TabButton('summary', Icons.PieChart, '總計')
        )
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
